<html>
  <style>
    .site-cos .slds-visual-picker-select .slds-visual-picker__figure svg {
        width: 43px;
        height: 40px;
        fill: #fff;
        stroke: #002a42;
    }
    fieldset div.slds-form-element__control {
        display: flex;
        -webkit-box-orient: horizontal;
        flex-flow: row wrap;
    }
    .site-cos .slds-visual-picker__container {
        margin-right: 1rem;
        margin-bottom: 20px;
    }
    .spinner {
        width: 60px;
        height: 60px;
        border: 6px solid #ccc;
        border-top: 6px solid #007acc;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: auto;
      }
      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .slds-scope .slds-select_container:before, .slds-scope .slds-select_container:after {
          border-right:none;
          border-left:none;
      }
  </style>
<script src="lwc12_ContactUsForm"></script>
<script src="https://transformcambodia.my.site.com/sponsor/lightning/lightning.out.js"></script>
  <div id="spinner" class="spinner"></div>
<div data-lightning-out="true" class="site-cos"></div>
  <script>
    console.log("v2.0");
    const appName='c:LC02_DonateNowApp';
    const componentname='c:lwc02DonateNow';
    const lightningEndPoint='https://transformcambodia--dev3.sandbox.my.site.com/sponsor/';
    const targetElement=document.querySelector("[data-lightning-out]");
    
    const urlParams = Object.fromEntries(
        new URLSearchParams(window.location.search)
    );
    
    const componentParams = {
		  paramsJson: JSON.stringify(urlParams) 
    };
    
     $Lightning.use(
        appName, 
        function() {
          console.log('Run Create Component function.');
          $Lightning.createComponent(
              componentname,
              componentParams,
              targetElement ,
                function(cmp) {
                  console.log("LWC component is Loaded.");
                  document.getElementById("spinner").style.display = "none";
                }
            );
        },
        lightningEndPoint
      );
</script>

</html>
